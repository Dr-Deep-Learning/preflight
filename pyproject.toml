[project]
name = "preflight"
version = "0.1.0"
description = "Pre-launch security review for AI-built applications: a deterministic rule engine with an LLM strictly downstream of detection."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Amit Sethi" }]
keywords = ["security", "sast", "supabase", "rls", "secrets", "vibe-coding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.7",
  "jinja2>=3.1",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34"]

[project.scripts]
preflight = "preflight.cli:app"

[project.urls]
Homepage = "https://github.com/Dr-Deep-Learning/preflight"
Issues = "https://github.com/Dr-Deep-Learning/preflight/issues"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "httpx>=0.27",
  "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ANN", "PTH", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["preflight", "conftest"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
exclude = ["fixtures/"]

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
