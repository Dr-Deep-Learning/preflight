id: AUTH-004
title: Authorization enforced only in the frontend
category: access-control
severity: high
detector: llm
status: experimental
applies_to:
  stacks: [react, nextjs, vite]
  globs: ["**/*.{js,jsx,ts,tsx}"]
cwe: [602]
description: >
  Access to admin features or other users' data is controlled only by hiding UI
  (checking a role in a React component) while the underlying API route, database
  query, or policy performs no equivalent check. Anyone can call the API directly.
why_ai_apps: >
  "Only show the admin page to admins" gets implemented literally, as a UI change.
bad_example: |
  {user.role === "admin" && <button onClick={() => fetch(`/api/users/${id}`, { method: "DELETE" })}>Delete</button>}
  // app/api/users/[id]/route.ts
  export async function DELETE(req, { params }) {
    await db.user.delete({ where: { id: params.id } });  // no role check
  }
good_example: |
  export async function DELETE(req, { params }) {
    const session = await getSession();
    if (session?.user.role !== "admin") return new Response("Forbidden", { status: 403 });
    await db.user.delete({ where: { id: params.id } });
  }
false_positive_notes: >
  UI gating is fine and expected when the server also enforces the check. Needs
  cross-file context: the component and the handler it calls. Report with low
  confidence if the handler can't be located.
references:
  - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
