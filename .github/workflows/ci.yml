name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --extra llm

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov=preflight --cov-report=term-missing
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

      # The fixture corpus is only meaningful if the scanner actually fails on it.
      - name: Scan the vulnerable fixture (must fail)
        run: |
          if uv run preflight scan fixtures/vulnerable-app; then
            echo "::error::the scanner passed an app with three planted defects"
            exit 1
          fi

      - name: Scan the clean fixture (must pass)
        run: uv run preflight scan fixtures/clean-app

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: preflight:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name preflight -p 8000:8000 preflight:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break || sleep 1
          done
          curl -fsS http://localhost:8000/healthz | grep -q '"status":"ok"'
          docker rm -f preflight
