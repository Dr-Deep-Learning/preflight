id: PAY-001
title: Stripe webhook without signature verification
category: payments
severity: critical
detector: both
status: active
applies_to:
  stacks: [stripe]
  globs: ["**/*webhook*.{js,ts}", "app/api/**/*.{js,ts}", "pages/api/**/*.{js,ts}", "supabase/functions/**/*.ts"]
cwe: [345]
description: >
  A webhook endpoint acts on payment events (grants access, marks orders paid)
  without verifying the Stripe-Signature header. Anyone can POST a fake
  "checkout.session.completed" event and get paid features free.
why_ai_apps: >
  Signature verification needs the raw request body, which framework defaults
  parse away; when it errors, the AI "fixes" it by parsing JSON directly.
bad_example: |
  export async function POST(req) {
    const event = await req.json();
    if (event.type === "checkout.session.completed") await grantPro(event.data.object.customer);
  }
good_example: |
  export async function POST(req) {
    const body = await req.text();
    const sig = req.headers.get("stripe-signature");
    const event = stripe.webhooks.constructEvent(body, sig, process.env.STRIPE_WEBHOOK_SECRET);
    if (event.type === "checkout.session.completed") await grantPro(event.data.object.customer);
  }
false_positive_notes: >
  Handlers that re-fetch the event or session from the Stripe API by ID before
  acting are also safe. Verification may live in a shared helper; follow the call.
references:
  - https://docs.stripe.com/webhooks
